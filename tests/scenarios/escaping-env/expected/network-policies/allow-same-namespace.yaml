# Allows all traffic between pods of the project namespace (application, storefront,
# Redis, RabbitMQ, consumers, cron and any components added by the project).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: allow-same-namespace
    namespace: "myproject-production"
spec:
    podSelector: {}
    policyTypes:
        - Ingress
    ingress:
        -   from:
                -   podSelector: {}
