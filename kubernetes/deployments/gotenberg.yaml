apiVersion: apps/v1
kind: Deployment
metadata:
    name: gotenberg
spec:
    replicas: 1
    selector:
        matchLabels:
            app: gotenberg
    template:
        metadata:
            annotations:
                logging/enabled: "false"
                project/app: "gotenberg"
                project/environment: "{{PROJECT_ENVIRONMENT}}"
                project/name: "{{NAME_OF_PROJECT}}"
            labels:
                app: gotenberg
        spec:
            containers:
                -   name: gotenberg
                    image: "{{GOTENBERG_VERSION}}"
                    ports:
                        -   name: http
                            containerPort: 3000
                            protocol: TCP
                    livenessProbe:
                        initialDelaySeconds: 10
                        timeoutSeconds: 5
                        httpGet:
                            path: /health
                            port: 3000
                    readinessProbe:
                        initialDelaySeconds: 5
                        timeoutSeconds: 5
                        httpGet:
                            path: /health
                            port: 3000
                    resources:
                        limits:
                            memory: "1Gi"
                        requests:
                            cpu: "50m"
                            memory: "512Mi"
