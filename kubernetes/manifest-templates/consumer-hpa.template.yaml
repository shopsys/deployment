apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
    name: consumer-{{NAME}}
    labels:
        app: consumer-{{NAME}}
        consumer-autoscaling: "true"
spec:
    scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: consumer-{{NAME}}
    minReplicas: {{MIN_REPLICAS}}
    maxReplicas: {{MAX_REPLICAS}}
    metrics:
        -   type: External
            external:
                metric:
                    name: rabbitmq_queue_backlog
                    selector:
                        matchExpressions:
                            -   key: queue
                                operator: In
                                values: [{{QUEUE_NAMES}}]
                target:
                    type: AverageValue
                    averageValue: "{{SCALE_THRESHOLD}}"
    behavior:
        scaleUp:
            stabilizationWindowSeconds: 0
            policies:
                -   type: Percent
                    value: 100
                    periodSeconds: 30
                -   type: Pods
                    value: 4
                    periodSeconds: 30
            selectPolicy: Max
        scaleDown:
            stabilizationWindowSeconds: 300
            policies:
                -   type: Pods
                    value: 1
                    periodSeconds: 120
